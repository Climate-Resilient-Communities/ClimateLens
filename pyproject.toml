# ClimateLens project metadata + tooling configuration.
#
# The pipeline is distributed as standalone scripts under src/ rather than an
# installed package, so this file is primarily used to configure formatters,
# linters, and test runners. Removing the legacy flit/[project] block lets
# `pip install -r requirements.txt` succeed without a package skeleton.

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License"
]

dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.2",
  
  "scikit-learn==1.5.1",
  "torch==2.2.2",
  "sentence-transformers==3.0.1",
  "umap-learn==0.5.6",
  "hdbscan==0.8.38.post1",
  "bertopic==0.16.4",
  "mlflow==2.14.3",

  "matplotlib==3.10.0",
  "seaborn==0.13.2",
  "plotly==5.23.0",
  "kaleido==0.2.1",
  "tqdm==4.67.1",

  "python-dotenv",
]

[project.optional-dependencies]
dev = [
  "black",
  "ruff",
  "pytest",
  "mkdocs"
]

[tool.black]
line-length = 99
target-version = ["py310"]

[tool.ruff]
enabled = false
line-length = 99
target-version = "py310"
extend-exclude = [
    "src/LDA",
    "khp_climate_anxiety",
    ".venv",
]

[tool.ruff.lint]
# Conservative ruleset: syntax errors, undefined names, unused imports, and
# obvious bugs - but nothing so opinionated it blocks day-to-day work.
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line length enforced by formatter
    "E731",  # allow lambda assignments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"