[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "climate-lens"
version = "1.2.1"
description = "Machine learning and NLP pipeline for detecting youth-written text and classifying climate-anxiety discourse using taxonomy-driven models."
authors = [
  { name = "Climate Resilient Communities" }
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = "~=3.10"

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License"
]

dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.2",
  
  "scikit-learn==1.5.1",
  "torch==2.2.2",
  "sentence-transformers==3.0.1",
  "umap-learn==0.5.6",
  "hdbscan==0.8.38.post1",
  "bertopic==0.16.4",
  "mlflow==2.14.3",

  "matplotlib==3.10.0",
  "seaborn==0.13.2",
  "plotly==5.23.0",
  "kaleido==0.2.1",
  "tqdm==4.67.1",

  "python-dotenv",
]

[project.optional-dependencies]
dev = [
  "black",
  "ruff",
  "pytest",
  "mkdocs"
]

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
  \.git
 | \.venv
 | __pycache__
)/
'''

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known_first_party = ["khp_climate_anxiety"]
force_sort_within_sections = true