name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install lightweight test dependencies
        # Deliberately avoid installing the heavy ML stack (torch,
        # transformers, bertopic) in CI. The unit + smoke tests are designed
        # to run without them; the ML-heavy tests are auto-skipped via
        # pytest.importorskip.
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pandas==2.2.2 \
            numpy==1.26.4 \
            python-dotenv==1.0.1 \
            pyyaml==6.0.2 \
            pytest==8.3.3 \
            ruff==0.6.9 \
            "spacy>=3.7.0,<4.0.0"

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Ruff (format check)
        run: ruff format --check src tests

      - name: Compile check
        run: |
          python -m compileall -q src tests

      - name: Run unit + smoke tests
        env:
          # Force a fresh runtime layout under the runner workspace.
          DATA_DIR: ${{ github.workspace }}/data
        run: pytest tests/ -v --tb=short
